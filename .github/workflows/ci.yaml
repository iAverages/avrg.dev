name: Check and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Mic92/niks3-action@v1
        continue-on-error: true
        with:
          server-url: https://niks3.kirsi.dev
          skip-push: ${{ github.ref != 'refs/heads/main' }}

      - name: run checks
        run: nix flake check --print-build-logs --fallback

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: Mic92/niks3-action@v1
        continue-on-error: true
        with:
          server-url: https://niks3.kirsi.dev
          skip-push: true

      - name: deploy to cloudflare
        run: nix develop --command wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
